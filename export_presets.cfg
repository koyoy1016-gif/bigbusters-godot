vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
window.bbFirebase = {
  state: { status: 'idle', uid: '', error: '' },
  signIn: async function (configJson) {
    if (this.state.status !== 'idle') { return; }
    this.state.status = 'pending';
    try {
      var base = 'https://www.gstatic.com/firebasejs/11.10.0/';
      var appSdk = await import(base + 'firebase-app.js');
      var authSdk = await import(base + 'firebase-auth.js');
      var app = appSdk.initializeApp(JSON.parse(configJson));
      var cred = await authSdk.signInAnonymously(authSdk.getAuth(app));
      this.state.uid = cred.user.uid;
      this.state.status = 'ok';
    } catch (e) {
      this.state.error = ((e && e.code) ? e.code + ' ' : '') + ((e && e.message) ? e.message : String(e));
      this.state.status = 'error';
    }
  }
};
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
