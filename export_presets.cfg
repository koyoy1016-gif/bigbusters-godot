    var ref = d.ref(s.database, 'rooms/' + code + '/players/' + slot);
    var posRef = d.ref(s.database, 'rooms/' + code + '/positions/' + slot);
    var hitsRef = d.ref(s.database, 'rooms/' + code + '/hits/' + slot);
