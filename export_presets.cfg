    var slots = ['p1', 'p2', 'p3', 'p4'];
    if (i >= slots.length) {
      this.state.status = 'full';
      this._desired = null;
      this._watch(s, code);
      this._stopHeartbeat();
      return Promise.resolve('');
    }
    var slot = slots[i];
    if (this._isLive(taken[slot], s.uid)) { return this._tryClaim(s, code, taken, i + 1); }
