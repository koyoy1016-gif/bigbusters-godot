    var o = {};
    try { o = JSON.parse(t || '{}') || {}; } catch (e) { o = {}; }
    return {
      hold_ms: typeof o.hold_ms === 'number' ? o.hold_ms : 60000,
      heartbeat_ms: typeof o.heartbeat_ms === 'number' ? o.heartbeat_ms : 5000
