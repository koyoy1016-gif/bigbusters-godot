      if (Date.now() - this._checkStarted > this._replyMs) {
        this._checking = false;
        this.state.connection = 'disconnected';
        this.state.status = 'reconnecting';
      }
      return;
    }
    this._checking = true;
    this._checkStarted = Date.now();
