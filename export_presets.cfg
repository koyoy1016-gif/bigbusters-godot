    var s = this._active;
    var slot = this.state.slot;
    if (!s || !slot) { return false; }
    var d = s.sdk.db;
    var ref = d.ref(s.database, 'rooms/' + this.state.room + '/positions/' + slot);
    var self = this;
    this.state.sent += 1;
